<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>STUDENT REGISTRATION FORM</h1>
</header>

<form>

<table>

    <tr>
        <td><label for="firstname">First Name</label></td>
        <td>
            <input type="text" id="firstname" name="firstname" placeholder="Enter first name" required>
        </td>
    </tr>

    <tr>
        <td><label for="lastname">Last Name</label></td>
        <td>
            <input type="text" id="lastname" name="lastname" placeholder="Enter last name" required>
        </td>
    </tr>

    <tr>
        <td><label for="email">Email</label></td>
        <td>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </td>
    </tr>

    <tr>
        <td><label for="password">Password</label></td>
        <td>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </td>
    </tr>

    <tr>
        <td><label for="phone">Phone Number</label></td>
        <td>
            <input type="tel" id="phone" name="phone" placeholder="10-digit number">
        </td>
    </tr>

    <tr>
        <td>Gender</td>
        <td>
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
        </td>
    </tr>

    <tr>
        <td><label for="dob">Date of Birth</label></td>
        <td>
            <input type="date" id="dob" name="dob">
        </td>
    </tr>

    <tr>
        <td><label for="course">Course</label></td>
        <td>
            <select id="course" name="course">
                <option value="">Select Course</option>
                <option>B.Tech</option>
                <option>BCA</option>
                <option>B.Sc</option>
                <option>MCA</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>Hobbies</td>
        <td>
            <label><input type="checkbox" name="hobby" value="Reading"> Reading</label>
            <label><input type="checkbox" name="hobby" value="Sports"> Sports</label>
            <label><input type="checkbox" name="hobby" value="Music"> Music</label>
        </td>
    </tr>

    <tr>
        <td><label for="address">Address</label></td>
        <td>
            <textarea id="address" name="address" rows="4" cols="30" placeholder="House no, street, city"></textarea>
        </td>
    </tr>

    <tr>
        <td><label for="photo">Upload Photo</label></td>
        <td>
            <input type="file" id="photo" name="photo" accept="image/*">
        </td>
    </tr>

    <tr>
        <td colspan="2" class="actions">
            <input type="submit" value="Register">
            <input type="reset" value="Reset">
        </td>
    </tr>

</table>

</form>

</body>
</html>
